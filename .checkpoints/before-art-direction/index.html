<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xavier Hery | International Business, Technology, Strategy</title>
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Sans';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/GeistMono-Variable.woff2') format('woff2');
      }
      /* Global CSS Reset for sizing and overflow prevention */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }
      /* Hide scrollbar visually while keeping full scroll functionality */
      html {
        overflow-y: scroll;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE & Edge */
      }
      body {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      ::-webkit-scrollbar {
        display: none;
        width: 0px;
        background: transparent;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Geist"', '"Geist Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
              mono: ['"Geist Mono"', '"JetBrains Mono"', 'ui-monospace', 'monospace'],
              serif: ['"Geist"', '"Geist Sans"', 'sans-serif'],
              display: ['"Geist"', '"Geist Sans"', 'sans-serif'],
            }
          }
        }
      };
    </script>
  </head>
  <body class="text-[#171717] antialiased" style="background-color: var(--ocean-background, #FFFFFF)">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
