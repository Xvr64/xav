<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>3D ASCII whale · dev bench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
      body.dark { background: #05080a; }
      #whale { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
      #panel {
        position: fixed; top: 12px; left: 12px; z-index: 2; width: 236px; padding: 10px 12px;
        font: 11px/1.3 "JetBrains Mono", monospace; color: #1f3b57;
        background: rgba(255, 255, 255, 0.86); border: 1px solid rgba(31, 59, 87, 0.18);
      }
      body.dark #panel { color: #cfe0e4; background: rgba(5, 8, 10, 0.8); border-color: rgba(207, 224, 228, 0.2); }
      #panel h1 { font: 600 11px/1 "JetBrains Mono", monospace; margin: 0 0 8px; letter-spacing: 0.08em; text-transform: uppercase; }
      .row { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 6px; margin: 3px 0; }
      .row input[type='range'], .row select { width: 100%; font: inherit; }
      #lost { position: fixed; bottom: 12px; left: 12px; font: 12px "JetBrains Mono", monospace; color: #a33; }
    </style>
  </head>
  <body>
    <canvas id="whale" aria-label="3D ASCII humpback whale"></canvas>
    <div id="panel"><h1>ascii whale · dev</h1></div>
    <p id="lost" hidden>WebGL context lost — reload to restore.</p>
    <script type="module" src="/whaleShowcase.ts"></script>
  </body>
</html>
